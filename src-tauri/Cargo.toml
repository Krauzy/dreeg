[package]
name = "dreeg-app"
version.workspace = true
edition.workspace = true
description = "A safe, local Grim Dawn save editor"

[lib]
name = "dreeg_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dreeg"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
gd-save = { path = "../crates/gd-save" }
gd-discovery = { path = "../crates/gd-discovery" }
gd-db = { path = "../crates/gd-db" }
serde.workspace = true
serde_json = "1"
tauri = { version = "2", features = [] }
